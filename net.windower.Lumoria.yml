app-id: net.windower.Lumoria
runtime: org.gnome.Platform
runtime-version: '51'
base: org.winehq.Wine
base-version: stable-26.08
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.vala
  - org.freedesktop.Sdk.Extension.rust-stable
command: lumoria

build-options:
  prepend-path: /usr/lib/sdk/vala/bin:/usr/lib/sdk/rust-stable/bin
  prepend-ld-library-path: /usr/lib/sdk/vala/lib

finish-args:
  - --device=all
  - --allow=devel
  - --socket=wayland
  - --socket=fallback-x11
  - --allow=multiarch
  - --socket=pulseaudio
  - --share=network
  - --share=ipc

add-extensions:
  org.freedesktop.Platform.Compat.i386:
    directory: lib/i386-linux-gnu
    version: '26.08'
  org.freedesktop.Platform.GL32:
    directory: lib/i386-linux-gnu/GL
    version: '1.4'
    versions: 26.08;26.08-extra;1.4
    subdirectories: true
    no-autodownload: true
    add-ld-path: lib
    download-if: active-gl-driver
    enable-if: active-gl-driver
    autoprune-unless: active-gl-driver
    merge-dirs: vulkan/icd.d;glvnd/egl_vendor.d;egl/egl_external_platform.d;OpenCL/vendors;lib/dri;lib/d3d;lib/gbm;vulkan/explicit_layer.d;vulkan/implicit_layer.d;vdpau

inherit-extensions:
  - org.winehq.Wine.gecko
  - org.winehq.Wine.mono

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - /share/man
  - /share/vala
  - /share/cmake
  - /lib/cmake
  - /lib/girepository-1.0
  - /libexec/vte-urlencode-cwd
  - /share/gir-1.0
  - '*.la'
  - '*.a'

modules:

  - name: fast_float
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/fastfloat/fast_float.git
        tag: v8.3.3
        commit: dbeabeeb3e6791cb96994c2a7a084c36e62ccfb2

  - name: simdutf
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/simdutf/simdutf.git
        tag: v9.3.3
        commit: 59589cd3df6823cbfdbd253cde3377e7c3e1fe9b

  - name: vte
    buildsystem: meson
    config-opts:
      - --buildtype=release
      - -Dgtk3=false
      - -Dgtk4=true
      - -Dglade=false
      - -Dgir=true
      - -Dvapi=true
      - -Dapp=false
      - -Dicu=false
      - -D_systemd=false
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/vte.git
        tag: 0.84.1
        commit: f2223e45d7f04c5383c59e76772501f0ed4215bc

  - name: libmspack
    buildsystem: autotools
    subdir: libmspack
    build-options:
      strip: true
    sources:
      - type: git
        url: https://github.com/kyz/libmspack.git
        tag: v1.11
        commit: 305907723a4e7ab2018e58040059ffb5e77db837

  - name: libportal
    buildsystem: meson
    config-opts:
      - -Ddocs=false
      - -Dbackend-qt5=disabled
      - -Dbackend-qt6=disabled
    sources:
      - type: git
        url: https://github.com/flatpak/libportal.git
        tag: 0.11.0
        commit: fc4d62cfe131e8494c82f597f92b2234d584c367

  - name: libgit2
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTS=OFF
      - -DBUILD_CLI=OFF
      - -DBUILD_SHARED_LIBS=ON
      - -DUSE_SSH=OFF
      - -DREGEX_BACKEND=builtin
    sources:
      - type: git
        url: https://github.com/libgit2/libgit2.git
        tag: v1.9.7
        commit: 49e408b3208bc3093757a1c2db938d3590f3f412

  - name: libgit2-glib
    buildsystem: meson
    config-opts:
      - -Dpython=false
      - -Dvapi=true
      - -Dssh=false
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/libgit2-glib.git
        tag: 1.2.1
        commit: 4684169522f31796e1d1daedd90aae35e89c4d86

  - name: compat-mountpoints
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/i386-linux-gnu/GL

  - name: lumoria
    builddir: true
    buildsystem: meson
    build-options:
      env:
        CARGO_HOME: /run/build/lumoria/cargo
        CARGO_NET_OFFLINE: 'true'
    sources:
      - type: git
        url: https://github.com/Windower/Lumoria.git
        tag: v0.2.2
        commit: cdaf217aa73e16f8cacc17c61a8bf79b931da9bf
        x-checker-data:
          type: git
          tag-pattern: ^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.\-]+)?)$
          version-scheme: semantic
          is-main-source: true
      - cargo-sources.json
